<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端考試座位管理系統</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fixed: #ffeaa7; --fixed-border: #fdcb6e;
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --bg: #f0f4ff; --surface: #ffffff;
            --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --purple: #7c3aed;
            --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0;
            --admin-accent: #2563eb;
            --teacher-accent: #7c3aed;
            --notif-bg: #fef3c7; --notif-border: #f59e0b;
            --sidebar-w: 340px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            padding: 0;
            box-shadow: 4px 0 20px rgba(0,0,0,0.06);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0;
            background: var(--surface);
            z-index: 10;
        }

        .role-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .role-badge.admin { background: #dbeafe; color: var(--admin-accent); }
        .role-badge.teacher { background: #ede9fe; color: var(--teacher-accent); }

        .user-display-name {
            font-size: 18px; font-weight: 700; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .user-sub-info {
            font-size: 12px; color: var(--text-muted);
        }

        .sidebar-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }

        .config-group {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .config-group h3 {
            margin: 0 0 14px 0;
            font-size: 14px; font-weight: 700; color: var(--text);
            display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input[type="text"], input[type="number"], input[type="password"], textarea, select {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 14px;
            background: white; color: var(--text);
            font-family: inherit;
            transition: border-color 0.2s;
            margin-bottom: 10px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        button {
            width: 100%; padding: 11px 14px;
            margin-bottom: 8px; border: none;
            border-radius: 8px; cursor: pointer;
            font-weight: 700; transition: all 0.15s;
            font-size: 14px; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        button:hover { filter: brightness(1.06); transform: translateY(-1px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-new    { background: #fee2e2; color: #b91c1c; }
        .btn-cloud  { background: #dbeafe; color: var(--primary-dark); }
        .btn-load   { background: #d1fae5; color: #065f46; }
        .btn-init   { background: var(--text); color: white; }
        .btn-shuffle{ background: var(--primary); color: white; font-size: 15px; }
        .btn-img    { background: #fef3c7; color: #92400e; }
        .btn-pdf    { background: #fee2e2; color: #b91c1c; }
        .btn-out    { background: #f1f5f9; color: var(--text-muted); }

        .btn-row { display: flex; gap: 8px; }
        .btn-row button { margin-bottom: 0; }

        #notif-panel {
            background: var(--notif-bg);
            border: 1.5px solid var(--notif-border);
            border-radius: 12px; padding: 14px;
            display: none;
        }
        #notif-panel.visible { display: block; }

        .main-content {
            flex-grow: 1; display: flex;
            align-items: flex-start; justify-content: center;
            overflow: auto; padding: 40px;
        }

        #capture-area {
            background: white; padding: 50px;
            border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.06);
            min-width: fit-content; margin: auto; position: relative;
        }

        #class-title-display {
            text-align: center; font-size: 2.5rem;
            margin: 0 0 36px 0; color: var(--text);
            font-weight: 900;
        }

        .grid { display: grid; gap: 14px; justify-content: center; }

        .seat {
            width: 120px; height: 86px;
            border: 2px solid var(--border);
            border-radius: 10px; display: flex;
            flex-direction: column; align-items: center;
            justify-content: center; background: #fff;
            cursor: pointer; position: relative;
            transition: all 0.18s ease;
            user-select: none;
        }
        .seat.is-fixed { background: var(--fixed); border-color: var(--fixed-border); }
        .student-name { font-size: 1.2rem; font-weight: 700; pointer-events: none; }

        /* ════ 認證介面 ════ */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }
        #auth-overlay.hidden { display: none; }
        .auth-box {
            background: white; padding: 40px;
            border-radius: 20px; width: 400px;
            text-align: center;
        }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 12px 24px;
            border-radius: 10px; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 9999;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h2 id="auth-title">🏫 座位管理系統登入</h2>
        <div style="text-align:left; margin-top:20px;">
            <label>中文姓名 / 帳號</label>
            <input type="text" id="auth-username" placeholder="請輸入中文姓名">
            <label>密碼 (英數文字)</label>
            <input type="password" id="auth-password" placeholder="請輸入密碼">
        </div>
        <button class="btn-init" style="background:var(--primary); margin-top:10px;" id="btn-auth-action" onclick="handleAuth()">🔐 登入系統</button>
        <div style="margin-top:15px; font-size:14px; color:var(--primary); cursor:pointer;" onclick="toggleAuthMode()" id="auth-switch-text">還沒有帳號？點此註冊</div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="role-badge" id="role-badge">⏳ 讀取中</div>
        <div class="user-display-name" id="user-display-name">讀取中...</div>
        <div class="user-sub-info" id="user-sub-info"></div>
    </div>

    <div class="sidebar-body">
        <div id="notif-panel">
            <h3 style="margin:0 0 10px 0;">🔔 調整通知 <span id="notif-count">0</span></h3>
            <button onclick="clearNotifications()" style="font-size:12px; padding:5px;">標為已讀</button>
        </div>

        <div id="admin-setup-panel" class="config-group" style="display:none; background:#f5f3ff;">
            <h3>👤 管理權限</h3>
            <div id="main-admin-info" style="font-size:12px; color:var(--purple); margin-bottom:10px;"></div>
            <input type="text" id="setup-username" placeholder="導師姓名">
            <select id="setup-class"><option value="">選擇班級</option></select>
            <button onclick="assignTeacher()" class="btn-init" style="background:var(--purple);">＋ 指派權限</button>
        </div>

        <div class="config-group">
            <h3>🗂️ 班級管理</h3>
            <button class="btn-new" onclick="createNewClass()">➕ 建立新班級</button>
            <select id="classDropdown"><option value="">-- 選擇班級 --</option></select>
            <div class="btn-row">
                <button class="btn-load" onclick="loadFromDropdown()">📂 載入</button>
                <button class="btn-cloud" onclick="saveToCloud()">☁️ 儲存</button>
            </div>
            <div class="btn-row" style="margin-top:8px;">
                <button class="btn-img" onclick="downloadImage()">🖼️ 圖片</button>
                <button class="btn-pdf" onclick="downloadPDF()">📄 PDF</button>
            </div>
        </div>

        <div class="config-group" id="layout-group">
            <h3>✏️ 教室配置</h3>
            <label>班級名稱</label>
            <input type="text" id="classTitle" oninput="syncTitle()" placeholder="例如：資二甲">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;"><label>欄</label><input type="number" id="cols" value="5"></div>
                <div style="flex:1;"><label>列</label><input type="number" id="rows" value="5"></div>
            </div>
            <button class="btn-init" onclick="confirmInit()">🔄 重新佈局</button>
        </div>

        <div class="config-group" id="shuffle-group">
            <h3>🎲 隨機抽籤</h3>
            <textarea id="studentList" placeholder="每行輸入一個姓名..." style="height:100px;"></textarea>
            <button class="btn-shuffle" onclick="shuffleNonFixed()">🎲 開始抽籤</button>
        </div>

        <button class="btn-out" onclick="handleLogout()">🚪 登出系統</button>
    </div>
</div>

<div class="main-content">
    <div id="capture-area">
        <h1 id="class-title-display">請輸入班級名稱</h1>
        <div id="grid" class="grid"></div>
        <div style="margin-top:30px;">
            <label>📝 備註事項</label>
            <textarea id="class-remarks" style="width:100%; height:80px; border:1px dashed #ccc; padding:10px;" placeholder="輸入備註..."></textarea>
        </div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, collection, query, where, orderBy, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMfrzpvb3YO_O8DOBiIEghmp27UNC7ZL4",
        authDomain: "examseating-859ae.firebaseapp.com",
        projectId: "examseating-859ae",
        storageBucket: "examseating-859ae.firebasestorage.app",
        messagingSenderId: "547686235744",
        appId: "1:547686235744:web:ba1b0032c43267ce340d05"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function usernameToEmail(username) {
        const clean = username.trim();
        return clean ? `${clean}@school.local` : null;
    }

    let currentUser = null;
    let currentRole = null;
    let currentUsername = "";
    let mainAdminUID = null;
    let mainAdminName = "";
    let isRegisterMode = false;

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    window.toggleAuthMode = () => {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "📝 教師帳號註冊" : "🏫 座位管理系統登入";
        document.getElementById('btn-auth-action').innerText = isRegisterMode ? "✅ 完成註冊" : "🔐 登入系統";
        document.getElementById('auth-switch-text').innerText = isRegisterMode ? "已有帳號？點此登入" : "還沒有帳號？點此註冊";
    };

    window.handleAuth = async () => {
        const userIn = document.getElementById('auth-username').value.trim();
        const passIn = document.getElementById('auth-password').value;
        if(!userIn || !passIn) return alert('請完整輸入帳號與密碼');
        const email = usernameToEmail(userIn);
        try {
            if(isRegisterMode) {
                await createUserWithEmailAndPassword(auth, email, passIn);
                await setDoc(doc(db, 'usernames', email), { displayName: userIn });
                showToast('註冊成功！');
            } else {
                await signInWithEmailAndPassword(auth, email, passIn);
            }
        } catch(e) { alert('操作失敗：' + e.message); }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-overlay').classList.add('hidden');
            const nameDoc = await getDoc(doc(db, 'usernames', user.email));
            currentUsername = nameDoc.exists() ? nameDoc.data().displayName : user.email.split('@')[0];
            document.getElementById('user-display-name').innerText = currentUsername;

            let roleDoc = await getDoc(doc(db, 'roles', user.email));
            if(!roleDoc.exists()){
                const allRoles = await getDocs(collection(db, 'roles'));
                if(allRoles.empty){
                    await setDoc(doc(db, 'roles', user.email), { role: 'admin', isMainAdmin: true, uid: user.uid });
                } else {
                    await setDoc(doc(db, 'roles', user.email), { role: 'teacher', uid: user.uid, class: '' });
                }
                roleDoc = await getDoc(doc(db, 'roles', user.email));
            }
            
            currentRole = roleDoc.data().role;
            const assignedClass = roleDoc.data().class || "";

            const mainSnap = await getDocs(query(collection(db, 'roles'), where('isMainAdmin', '==', true)));
            if(!mainSnap.empty){
                const mainData = mainSnap.docs[0].data();
                mainAdminUID = mainData.uid;
                const mnd = await getDoc(doc(db, 'usernames', mainSnap.docs[0].id));
                mainAdminName = mnd.exists() ? mnd.data().displayName : "管理者";
            } else {
                mainAdminUID = user.uid; mainAdminName = currentUsername;
            }

            applyUI(assignedClass);
            refreshClassList();
            initGrid();
        } else {
            document.getElementById('auth-overlay').classList.remove('hidden');
        }
    });

    function applyUI(assignedClass) {
        const isAdmin = currentRole === 'admin';
        const badge = document.getElementById('role-badge');
        badge.innerText = isAdmin ? "🛡️ 管理者" : "👨‍🏫 導師";
        badge.className = "role-badge " + (isAdmin ? "admin" : "teacher");
        document.getElementById('admin-setup-panel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('layout-group').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('shuffle-group').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('btn-new').style.display = isAdmin ? 'block' : 'none';
        if(isAdmin) document.getElementById('main-admin-info').innerText = `目前共用「${mainAdminName}」的資料庫`;
        else document.getElementById('user-sub-info').innerText = `管理班級：${assignedClass || '未分配'}`;
    }

    window.syncTitle = () => {
        document.getElementById('class-title-display').innerText = document.getElementById('classTitle').value || "請輸入班級名稱";
    };

    window.confirmInit = () => {
        if(!confirm('確定要重新佈局嗎？這將會清除目前的座位安排。')) return;
        initGrid();
    };

    window.initGrid = () => {
        const c = parseInt(document.getElementById('cols').value) || 5;
        const r = parseInt(document.getElementById('rows').value) || 5;
        const grid = document.getElementById('grid');
        grid.style.gridTemplateColumns = `repeat(${c}, 120px)`;
        grid.innerHTML = '';
        for(let i=0; i<c*r; i++) grid.appendChild(createSeat("", false));
    };

    function createSeat(name, fixed) {
        const div = document.createElement('div');
        div.className = 'seat' + (fixed ? ' is-fixed' : '');
        div.innerHTML = `<span class="student-name">${name}</span>`;
        div.onclick = () => {
            if(currentRole !== 'admin') return;
            div.classList.toggle('is-fixed');
        };
        return div;
    }

    async function refreshClassList() {
        const drop = document.getElementById('classDropdown');
        const setupDrop = document.getElementById('setup-class');
        drop.innerHTML = '<option value="">-- 選擇班級 --</option>';
        setupDrop.innerHTML = '<option value="">選擇班級</option>';
        const snap = await getDocs(collection(db, 'users', mainAdminUID, 'classes'));
        snap.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id; opt.innerText = d.id;
            drop.appendChild(opt);
            setupDrop.appendChild(opt.cloneNode(true));
        });
    }

    window.createNewClass = () => {
        document.getElementById('classTitle').value = "";
        document.getElementById('studentList').value = "";
        document.getElementById('class-remarks').value = "";
        syncTitle();
        initGrid();
        showToast('已準備好建立新班級');
    };

    window.saveToCloud = async () => {
        const title = document.getElementById('classTitle').value.trim();
        if(!title) return alert('請輸入班級名稱');
        const seats = Array.from(document.querySelectorAll('.seat')).map(s => ({
            name: s.querySelector('.student-name').innerText,
            fixed: s.classList.contains('is-fixed')
        }));
        await setDoc(doc(db, 'users', mainAdminUID, 'classes', title), {
            cols: document.getElementById('cols').value,
            rows: document.getElementById('rows').value,
            remarks: document.getElementById('class-remarks').value,
            seats, editor: currentUsername
        });
        showToast('✅ 儲存成功');
        refreshClassList();
    };

    window.loadFromDropdown = async () => {
        const selected = document.getElementById('classDropdown').value;
        if(!selected) return;
        const d = await getDoc(doc(db, 'users', mainAdminUID, 'classes', selected));
        if(d.exists()){
            const data = d.data();
            document.getElementById('classTitle').value = selected;
            document.getElementById('cols').value = data.cols;
            document.getElementById('rows').value = data.rows;
            document.getElementById('class-remarks').value = data.remarks || "";
            syncTitle();
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${data.cols}, 120px)`;
            grid.innerHTML = '';
            data.seats.forEach(s => grid.appendChild(createSeat(s.name, s.fixed)));
        }
    };

    window.shuffleNonFixed = () => {
        const students = document.getElementById('studentList').value.split('\n').map(s => s.trim()).filter(s => s);
        if(!students.length) return alert('請輸入學生名單');
        const seats = Array.from(document.querySelectorAll('.seat'));
        const nonFixedSeats = seats.filter(s => !s.classList.contains('is-fixed'));
        if(students.length > nonFixedSeats.length) return alert('學生人數大於可用位置數');
        
        nonFixedSeats.forEach(s => s.querySelector('.student-name').innerText = "");
        const shuffled = [...students].sort(() => Math.random() - 0.5);
        shuffled.forEach((name, i) => {
            nonFixedSeats[i].querySelector('.student-name').innerText = name;
        });
        showToast('🎲 隨機排列完成');
    };

    window.downloadImage = () => {
        html2canvas(document.getElementById('capture-area')).then(canvas => {
            const link = document.createElement('a');
            link.download = `座位表_${document.getElementById('classTitle').value || '未命名'}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    };

    window.downloadPDF = () => {
        html2canvas(document.getElementById('capture-area'), { scale: 2 }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const ratio = Math.min(pageWidth / (canvas.width / 2), pageHeight / (canvas.height / 2));
            pdf.addImage(imgData, 'PNG', 10, 10, (canvas.width / 2) * ratio - 20, (canvas.height / 2) * ratio - 20);
            pdf.save(`座位表_${document.getElementById('classTitle').value || '未命名'}.pdf`);
        });
    };

    window.assignTeacher = async () => {
        const name = document.getElementById('setup-username').value.trim();
        const cls = document.getElementById('setup-class').value;
        if(!name || !cls) return alert('請填寫完整');
        const email = usernameToEmail(name);
        await setDoc(doc(db, 'roles', email), { role: 'teacher', class: cls, uid: '' }, { merge: true });
        await setDoc(doc(db, 'usernames', email), { displayName: name }, { merge: true });
        showToast(`已指派 ${name} 管理 ${cls}`);
    };
</script>
</body>
</html>
