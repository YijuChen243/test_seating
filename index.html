<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端考試座位管理系統</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fixed: #ffeaa7; --fixed-border: #fdcb6e;
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --bg: #f0f4ff; --surface: #ffffff;
            --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --purple: #7c3aed;
            --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0;
            --admin-accent: #2563eb;
            --teacher-accent: #7c3aed;
            --sidebar-w: 340px;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text);
        }

        .sidebar {
            width: var(--sidebar-w); background: var(--surface);
            box-shadow: 4px 0 20px rgba(0,0,0,0.06);
            overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0;
        }

        .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
        .role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
        .role-badge.admin { background: #dbeafe; color: var(--admin-accent); }
        .role-badge.teacher { background: #ede9fe; color: var(--teacher-accent); }
        .user-display-name { font-size: 18px; font-weight: 700; }

        .sidebar-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .config-group { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .config-group h3 { margin: 0 0 14px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 10px; }

        button { width: 100%; padding: 11px; margin-bottom: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .btn-new { background: #fee2e2; color: #b91c1c; }
        .btn-cloud { background: #dbeafe; color: var(--primary-dark); }
        .btn-load { background: #d1fae5; color: #065f46; }
        .btn-init { background: var(--text); color: white; }
        .btn-shuffle { background: var(--primary); color: white; }
        .btn-img { background: #fef3c7; color: #92400e; }
        .btn-pdf { background: #fee2e2; color: #b91c1c; }
        .btn-out { background: #f1f5f9; color: var(--text-muted); }
        .btn-row { display: flex; gap: 8px; }

        .main-content { flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 40px; }
        #capture-area { background: white; padding: 50px; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); min-width: fit-content; position: relative; }
        #class-title-display { text-align: center; font-size: 2.5rem; margin: 0 0 36px 0; font-weight: 900; }

        .grid { display: grid; gap: 14px; justify-content: center; }
        .seat {
            width: 120px; height: 86px; border: 2px solid var(--border); border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fff; cursor: grab; position: relative; transition: 0.2s; user-select: none;
        }
        .seat:active { cursor: grabbing; transform: scale(1.05); z-index: 5; }
        .seat.is-fixed { background: var(--fixed); border-color: var(--fixed-border); }
        .seat.drag-over { border: 2px dashed var(--primary); background: #eff6ff; }
        .student-name { font-size: 1.1rem; font-weight: 700; pointer-events: none; text-align: center; word-break: break-all; padding: 0 5px; }

        #auth-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        #auth-overlay.hidden { display: none; }
        .auth-box { background: white; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 10px; opacity: 0; transition: 0.3s; z-index: 9999; }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h2 id="auth-title">🏫 座位管理系統登入</h2>
        <div style="text-align:left; margin-top:20px;">
            <label>中文姓名 / 帳號</label>
            <input type="text" id="auth-username" placeholder="請輸入中文姓名">
            <label>密碼</label>
            <input type="password" id="auth-password" placeholder="請輸入密碼">
        </div>
        <button class="btn-init" style="background:var(--primary); margin-top:10px;" id="btn-auth-action" onclick="handleAuth()">🔐 登入系統</button>
        <div style="margin-top:15px; font-size:14px; color:var(--primary); cursor:pointer;" onclick="toggleAuthMode()" id="auth-switch-text">還沒有帳號？點此註冊</div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="role-badge" id="role-badge">⏳ 讀取中</div>
        <div class="user-display-name" id="user-display-name">讀取中...</div>
        <div class="user-sub-info" id="user-sub-info" style="font-size:12px; color:var(--text-muted);"></div>
    </div>

    <div class="sidebar-body">
        <div id="admin-setup-panel" class="config-group" style="display:none; background:#f5f3ff;">
            <h3>👤 管理權限</h3>
            <div id="main-admin-info" style="font-size:12px; color:var(--purple); margin-bottom:10px;"></div>
            <input type="text" id="setup-username" placeholder="導師姓名">
            <select id="setup-class"><option value="">選擇班級</option></select>
            <button onclick="assignTeacher()" class="btn-init" style="background:var(--purple);">＋ 指派權限</button>
        </div>

        <div class="config-group">
            <h3>🗂️ 班級管理</h3>
            <button class="btn-new" id="btn-new" onclick="createNewClass()">➕ 建立新班級</button>
            <select id="classDropdown"><option value="">-- 選擇班級 --</option></select>
            <div class="btn-row">
                <button class="btn-load" onclick="loadFromDropdown()">📂 載入</button>
                <button class="btn-cloud" onclick="saveToCloud()">☁️ 儲存</button>
            </div>
            <div class="btn-row" style="margin-top:8px;">
                <button class="btn-img" onclick="downloadImage()">🖼️ 圖片</button>
                <button class="btn-pdf" onclick="downloadPDF()">📄 PDF</button>
            </div>
        </div>

        <div class="config-group" id="layout-group">
            <h3>✏️ 教室配置</h3>
            <label>班級名稱</label>
            <input type="text" id="classTitle" oninput="syncTitle()" placeholder="例如：資三乙">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;"><label>欄</label><input type="number" id="cols" value="5"></div>
                <div style="flex:1;"><label>列</label><input type="number" id="rows" value="5"></div>
            </div>
            <button class="btn-init" onclick="confirmInit()">🔄 重新佈局</button>
        </div>

        <div class="config-group" id="shuffle-group">
            <h3>🎲 隨機抽籤</h3>
            <textarea id="studentList" placeholder="每行輸入一個姓名..." style="height:100px;"></textarea>
            <button class="btn-shuffle" onclick="shuffleNonFixed()">🎲 開始抽籤</button>
            <p style="font-size:11px; color:var(--text-muted); margin-top:5px;">※ 點擊座位可手動編輯姓名，長按拖曳可交換位置。</p>
        </div>

        <button class="btn-out" onclick="handleLogout()">🚪 登出系統</button>
    </div>
</div>

<div class="main-content">
    <div id="capture-area">
        <h1 id="class-title-display">請輸入班級名稱</h1>
        <div id="grid" class="grid"></div>
        <div style="margin-top:30px;">
            <label>📝 備註事項</label>
            <textarea id="class-remarks" style="width:100%; height:80px; border:1px dashed #ccc; padding:10px;" placeholder="輸入備註..."></textarea>
        </div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMfrzpvb3YO_O8DOBiIEghmp27UNC7ZL4",
        authDomain: "examseating-859ae.firebaseapp.com",
        projectId: "examseating-859ae",
        storageBucket: "examseating-859ae.firebasestorage.app",
        messagingSenderId: "547686235744",
        appId: "1:547686235744:web:ba1b0032c43267ce340d05"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, currentRole = null, currentUsername = "", mainAdminUID = null, mainAdminName = "", isRegisterMode = false;
    let draggedElement = null;

    const usernameToEmail = (u) => u.trim() ? `${u.trim()}@school.local` : null;
    const showToast = (m) => { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); };

    window.toggleAuthMode = () => {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "📝 教師帳號註冊" : "🏫 座位管理系統登入";
        document.getElementById('btn-auth-action').innerText = isRegisterMode ? "✅ 完成註冊" : "🔐 登入系統";
        document.getElementById('auth-switch-text').innerText = isRegisterMode ? "已有帳號？點此登入" : "還沒有帳號？點此註冊";
    };

    window.handleAuth = async () => {
        const u = document.getElementById('auth-username').value.trim();
        const p = document.getElementById('auth-password').value;
        if(!u || !p) return alert('請完整輸入');
        const e = usernameToEmail(u);
        try {
            if(isRegisterMode) {
                await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, 'usernames', e), { displayName: u });
                showToast('註冊成功！');
            } else { await signInWithEmailAndPassword(auth, e, p); }
        } catch(err) { alert('失敗：' + err.message); }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-overlay').classList.add('hidden');
            const nameDoc = await getDoc(doc(db, 'usernames', user.email));
            currentUsername = nameDoc.exists() ? nameDoc.data().displayName : user.email.split('@')[0];
            document.getElementById('user-display-name').innerText = currentUsername;

            let rDoc = await getDoc(doc(db, 'roles', user.email));
            if(!rDoc.exists()){
                const all = await getDocs(collection(db, 'roles'));
                if(all.empty) await setDoc(doc(db, 'roles', user.email), { role: 'admin', isMainAdmin: true, uid: user.uid });
                else await setDoc(doc(db, 'roles', user.email), { role: 'teacher', uid: user.uid, class: '' });
                rDoc = await getDoc(doc(db, 'roles', user.email));
            }
            currentRole = rDoc.data().role;
            const assigned = rDoc.data().class || "";

            const mSnap = await getDocs(query(collection(db, 'roles'), where('isMainAdmin', '==', true)));
            if(!mSnap.empty){
                const mData = mSnap.docs[0].data();
                mainAdminUID = mData.uid;
                const mnd = await getDoc(doc(db, 'usernames', mSnap.docs[0].id));
                mainAdminName = mnd.exists() ? mnd.data().displayName : "管理者";
            } else { mainAdminUID = user.uid; mainAdminName = currentUsername; }

            applyUI(assigned);
            refreshClassList();
            initGrid();
        } else { document.getElementById('auth-overlay').classList.remove('hidden'); }
    });

    function applyUI(assigned) {
        const isAdmin = currentRole === 'admin';
        document.getElementById('role-badge').innerText = isAdmin ? "🛡️ 管理者" : "👨‍🏫 導師";
        document.getElementById('role-badge').className = "role-badge " + (isAdmin ? "admin" : "teacher");
        document.getElementById('admin-setup-panel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('layout-group').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('shuffle-group').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('btn-new').style.display = isAdmin ? 'block' : 'none';
        if(isAdmin) document.getElementById('main-admin-info').innerText = `共用「${mainAdminName}」的資料庫`;
        else document.getElementById('user-sub-info').innerText = `管理班級：${assigned || '未分配'}`;
    }

    window.syncTitle = () => document.getElementById('class-title-display').innerText = document.getElementById('classTitle').value || "請輸入班級名稱";

    window.confirmInit = () => { if(confirm('確定重新佈局？目前位置將清除。')) initGrid(); };

    window.initGrid = () => {
        const c = parseInt(document.getElementById('cols').value) || 5, r = parseInt(document.getElementById('rows').value) || 5;
        const grid = document.getElementById('grid');
        grid.style.gridTemplateColumns = `repeat(${c}, 120px)`;
        grid.innerHTML = '';
        for(let i=0; i<c*r; i++) grid.appendChild(createSeat("", false));
    };

    function createSeat(name, fixed) {
        const div = document.createElement('div');
        div.className = 'seat' + (fixed ? ' is-fixed' : '');
        div.draggable = true;
        div.innerHTML = `<span class="student-name">${name}</span>`;

        // 點擊編輯姓名
        div.onclick = () => {
            if(currentRole !== 'admin') return;
            const oldName = div.querySelector('.student-name').innerText;
            const newName = prompt("請輸入學生姓名（留空則清除）：", oldName);
            if (newName !== null) {
                div.querySelector('.student-name').innerText = newName.trim();
                if(newName.trim() === "") div.classList.remove('is-fixed');
            }
        };

        // 右鍵鎖定位置
        div.oncontextmenu = (e) => {
            e.preventDefault();
            if(currentRole !== 'admin') return;
            div.classList.toggle('is-fixed');
            showToast(div.classList.contains('is-fixed') ? "已鎖定該位置" : "已解除鎖定");
        };

        // 拖曳邏輯
        div.ondragstart = (e) => {
            if(currentRole !== 'admin') { e.preventDefault(); return; }
            draggedElement = div;
            e.dataTransfer.effectAllowed = "move";
            div.style.opacity = "0.5";
        };

        div.ondragend = () => {
            draggedElement = null;
            div.style.opacity = "1";
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('drag-over'));
        };

        div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-over'); };
        div.ondragleave = () => div.classList.remove('drag-over');

        div.ondrop = (e) => {
            e.preventDefault();
            if (draggedElement && draggedElement !== div) {
                // 交換姓名與固定狀態
                const targetName = div.querySelector('.student-name').innerText;
                const targetFixed = div.classList.contains('is-fixed');
                
                div.querySelector('.student-name').innerText = draggedElement.querySelector('.student-name').innerText;
                if(draggedElement.classList.contains('is-fixed')) div.classList.add('is-fixed'); else div.classList.remove('is-fixed');

                draggedElement.querySelector('.student-name').innerText = targetName;
                if(targetFixed) draggedElement.classList.add('is-fixed'); else draggedElement.classList.remove('is-fixed');
                
                showToast("已交換位置");
            }
            div.classList.remove('drag-over');
        };

        return div;
    }

    async function refreshClassList() {
        const drop = document.getElementById('classDropdown'), sDrop = document.getElementById('setup-class');
        drop.innerHTML = '<option value="">-- 選擇班級 --</option>'; sDrop.innerHTML = '<option value="">選擇班級</option>';
        const snap = await getDocs(collection(db, 'users', mainAdminUID, 'classes'));
        snap.forEach(d => {
            const opt = document.createElement('option'); opt.value = d.id; opt.innerText = d.id;
            drop.appendChild(opt); sDrop.appendChild(opt.cloneNode(true));
        });
    }

    window.createNewClass = () => {
        document.getElementById('classTitle').value = ""; document.getElementById('studentList').value = ""; document.getElementById('class-remarks').value = "";
        syncTitle(); initGrid(); showToast('準備建立新班級');
    };

    window.saveToCloud = async () => {
        const title = document.getElementById('classTitle').value.trim();
        if(!title) return alert('請輸入班級名稱');
        const seats = Array.from(document.querySelectorAll('.seat')).map(s => ({
            name: s.querySelector('.student-name').innerText,
            fixed: s.classList.contains('is-fixed')
        }));
        await setDoc(doc(db, 'users', mainAdminUID, 'classes', title), {
            cols: document.getElementById('cols').value, rows: document.getElementById('rows').value,
            remarks: document.getElementById('class-remarks').value, seats, editor: currentUsername
        });
        showToast('✅ 儲存成功'); refreshClassList();
    };

    window.loadFromDropdown = async () => {
        const s = document.getElementById('classDropdown').value;
        if(!s) return;
        const d = await getDoc(doc(db, 'users', mainAdminUID, 'classes', s));
        if(d.exists()){
            const data = d.data();
            document.getElementById('classTitle').value = s;
            document.getElementById('cols').value = data.cols;
            document.getElementById('rows').value = data.rows;
            document.getElementById('class-remarks').value = data.remarks || "";
            syncTitle();
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${data.cols}, 120px)`;
            grid.innerHTML = '';
            data.seats.forEach(seatData => grid.appendChild(createSeat(seatData.name, seatData.fixed)));
        }
    };

    window.shuffleNonFixed = () => {
        const students = document.getElementById('studentList').value.split('\n').map(s => s.trim()).filter(s => s);
        if(!students.length) return alert('請輸入名單');
        const seats = Array.from(document.querySelectorAll('.seat'));
        const available = seats.filter(s => !s.classList.contains('is-fixed'));
        if(students.length > available.length) return alert('學生人數大於可用位置');
        
        available.forEach(s => s.querySelector('.student-name').innerText = "");
        const shuffled = [...students].sort(() => Math.random() - 0.5);
        shuffled.forEach((name, i) => available[i].querySelector('.student-name').innerText = name);
        showToast('🎲 隨機排列完成');
    };

    window.downloadImage = () => {
        html2canvas(document.getElementById('capture-area')).then(canvas => {
            const link = document.createElement('a');
            link.download = `座位表_${document.getElementById('classTitle').value || '未命名'}.png`;
            link.href = canvas.toDataURL(); link.click();
        });
    };

    window.downloadPDF = () => {
        html2canvas(document.getElementById('capture-area'), { scale: 2 }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
            const ratio = Math.min(pw / (canvas.width / 2), ph / (canvas.height / 2));
            pdf.addImage(imgData, 'PNG', 10, 10, (canvas.width / 2) * ratio - 20, (canvas.height / 2) * ratio - 20);
            pdf.save(`座位表_${document.getElementById('classTitle').value || '未命名'}.pdf`);
        });
    };

    window.assignTeacher = async () => {
        const n = document.getElementById('setup-username').value.trim(), c = document.getElementById('setup-class').value;
        if(!n || !c) return alert('請填寫完整');
        const e = usernameToEmail(n);
        await setDoc(doc(db, 'roles', e), { role: 'teacher', class: c, uid: '' }, { merge: true });
        await setDoc(doc(db, 'usernames', e), { displayName: n }, { merge: true });
        showToast(`已指派 ${n} 管理 ${c}`);
    };
</script>
</body>
</html>
