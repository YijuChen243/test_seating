<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端考試座位管理系統 - 專業協作版</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --fixed: #ffeaa7; --fixed-border: #b45309; /* 加深固定座位的邊框顏色以便PDF顯示 */
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --bg: #f0f4ff; --surface: #ffffff;
            --success: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --purple: #7c3aed;
            --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-w: 340px;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text);
        }

        .sidebar {
            width: var(--sidebar-w); background: var(--surface);
            box-shadow: 4px 0 20px rgba(0,0,0,0.06);
            overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0;
        }

        .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
        .role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
        .role-badge.admin { background: #dbeafe; color: #2563eb; }
        .role-badge.teacher { background: #ede9fe; color: #7c3aed; }
        .user-display-name { font-size: 18px; font-weight: 700; }

        .sidebar-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .config-group { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .config-group h3 { margin: 0 0 14px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 10px; background: white; }
        input[readonly] { background: #f1f5f9; cursor: not-allowed; color: var(--text-muted); }

        button { width: 100%; padding: 11px; margin-bottom: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px; font-family: inherit; }
        button:hover { filter: brightness(0.95); transform: translateY(-1px); }
        .btn-new { background: #fee2e2; color: #b91c1c; }
        .btn-cloud { background: #dbeafe; color: #1d4ed8; }
        .btn-load { background: #d1fae5; color: #065f46; }
        .btn-init { background: var(--text); color: white; }
        .btn-shuffle { background: var(--primary); color: white; }
        .btn-img { background: #fef3c7; color: #92400e; }
        .btn-pdf { background: #fee2e2; color: #b91c1c; }
        .btn-out { background: #f1f5f9; color: var(--text-muted); }
        .btn-row { display: flex; gap: 8px; }

        .main-content { flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 40px; }
        #capture-area { 
            background: white; 
            padding: 60px 50px; 
            border-radius: 4px; 
            box-shadow: 0 8px 40px rgba(0,0,0,0.06); 
            width: 794px; 
            min-height: 1123px; 
            position: relative; 
            display: flex;
            flex-direction: column;
        }
        #class-title-display { text-align: center; font-size: 2.8rem; margin: 0 0 20px 0; font-weight: 900; letter-spacing: 2px; color: #0f172a; }

        /* 講桌樣式 (加深邊框) */
        .teacher-desk {
            width: 180px;
            padding: 10px;
            margin: 0 auto 30px auto;
            background-color: #f8fafc;
            border: 2px solid #475569; /* 加深為 #475569 */
            border-radius: 8px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #1e293b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            user-select: none;
        }

        .grid { display: grid; gap: 10px; justify-content: center; margin-bottom: 40px; }
        .seat {
            width: 100px; height: 75px; 
            border: 2px solid #475569; /* 加深為 #475569 以利 PDF 清晰呈現 */
            border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #fff; cursor: grab; position: relative; transition: 0.2s; user-select: none;
        }
        .seat.is-fixed { background: var(--fixed); border-color: var(--fixed-border); }
        .seat.drag-over { border: 2px dashed var(--primary); background: #eff6ff; }
        .student-name { font-size: 1.15rem; line-height: 1.2; font-weight: 700; pointer-events: none; text-align: center; word-break: break-all; padding: 0 5px; color: #0f172a; }

        .remarks-container { margin-top: auto; border-top: 2px solid #1e293b; padding-top: 20px; }
        .remarks-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 10px; display: block; color: #0f172a; }
        
        /* 人數統計標籤 */
        .student-count-badge {
            background: #e0e7ff;
            color: var(--primary-dark);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
        }

        #auth-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        #auth-overlay.hidden { display: none; }
        .auth-box { background: white; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 10px; opacity: 0; transition: 0.3s; z-index: 9999; }
        #toast.show { opacity: 1; }

        .admin-list { font-size: 12px; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h2 id="auth-title">🏫 座位管理系統登入</h2>
        <div style="text-align:left; margin-top:20px;">
            <label>中文姓名 / 帳號</label>
            <input type="text" id="auth-username" placeholder="請輸入中文姓名">
            <label>密碼</label>
            <div style="position: relative; margin-bottom: 10px;">
                <input type="password" id="auth-password" placeholder="請輸入密碼" style="padding-right: 40px; margin-bottom: 0;">
                <span id="toggle-password" onclick="togglePassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none;" title="顯示/隱藏密碼">👁️</span>
            </div>
        </div>
        <button class="btn-init" style="background:var(--primary); margin-top:15px;" id="btn-auth-action" onclick="handleAuth()">🔐 登入系統</button>
        <div style="margin-top:15px; font-size:14px; color:var(--primary); cursor:pointer;" onclick="toggleAuthMode()" id="auth-switch-text">還沒有帳號？點此註冊</div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="role-badge" id="role-badge">⏳ 讀取中</div>
        <div class="user-display-name" id="user-display-name">讀取中...</div>
        <div class="user-sub-info" id="user-sub-info" style="font-size:12px; color:var(--text-muted);"></div>
    </div>

    <div class="sidebar-body">
        <div id="admin-setup-panel" class="config-group" style="display:none; background:#f5f3ff;">
            <h3>🛡️ 權限與協作管理</h3>
            <div id="main-admin-info" style="font-size:11px; color:var(--purple); margin-bottom:10px; line-height:1.4;"></div>
            <label>選擇對象 (已註冊成員)</label>
            <select id="setup-username-select"><option value="">載入中...</option></select>
            <div class="btn-row">
                <button onclick="assignRole('admin')" class="btn-init" style="background:var(--purple); font-size:12px;">🔝 升級管理者</button>
                <button onclick="assignRole('teacher')" class="btn-init" style="background:var(--primary); font-size:12px;">👨‍🏫 指派導師</button>
            </div>
            <label style="margin-top:10px;">指派導師班級 (僅導師有效)</label>
            <select id="setup-class"><option value="">選擇班級</option></select>
            <div class="admin-list" id="admin-list"><strong>成員清單：</strong><div id="member-items"></div></div>
        </div>

        <div class="config-group">
            <h3>🗂️ 班級管理</h3>
            <button class="btn-new" id="btn-new" onclick="createNewClass()">➕ 建立新班級佈局</button>
            <select id="classDropdown"><option value="">-- 選擇班級 --</option></select>
            <div class="btn-row">
                <button class="btn-load" onclick="loadFromDropdown()">📂 載入佈局</button>
                <button class="btn-cloud" onclick="saveToCloud()">☁️ 儲存雲端</button>
            </div>
            <div class="btn-row" style="margin-top:8px;">
                <button class="btn-img" onclick="downloadImage()">🖼️ 匯出圖片 (A4直向)</button>
                <button class="btn-pdf" onclick="downloadPDF()">📄 匯出 PDF (A4直向)</button>
            </div>
        </div>

        <!-- 解除導師隱藏限制，讓導師也能調整欄列 -->
        <div class="config-group" id="layout-group">
            <h3>✏️ 教室配置</h3>
            <label>班級名稱</label>
            <input type="text" id="classTitle" oninput="syncTitle()" placeholder="例如：資三乙">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;"><label>欄 (直列)</label><input type="number" id="cols" value="5"></div>
                <div style="flex:1;"><label>列 (橫排)</label><input type="number" id="rows" value="5"></div>
            </div>
            <button class="btn-init" onclick="confirmInit()">🔄 重新初始化佈局</button>
        </div>

        <div class="config-group" id="shuffle-group">
            <h3>🎲 隨機排位 / 編輯</h3>
            <label>學生姓名名單 (每行一位)</label>
            <textarea id="studentList" placeholder="每行輸入一個姓名..." style="height:100px;"></textarea>
            <button class="btn-shuffle" onclick="shuffleNonFixed()">🎲 隨機排位</button>
            <p style="font-size:11px; color:var(--text-muted); margin-top:5px;">※ 點擊座位手動編輯，拖曳交換，右鍵鎖定位置。</p>
        </div>

        <button class="btn-out" onclick="handleLogout()">🚪 登出系統</button>
    </div>
</div>

<div class="main-content">
    <div id="capture-area">
        <h1 id="class-title-display">請輸入班級名稱</h1>
        <!-- 講桌 -->
        <div class="teacher-desk">👨‍🏫 講桌</div>
        
        <div id="grid" class="grid"></div>
        <div class="remarks-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label class="remarks-title" style="margin-bottom: 0;">📝 備註事項 / 考試說明</label>
                <!-- 人數統計標籤 -->
                <span id="student-count-display" class="student-count-badge">實排人數：0 人</span>
            </div>
            <!-- 加深備註欄邊框為 #475569 -->
            <textarea id="class-remarks" style="width:100%; height:120px; border:2px dashed #475569; padding:15px; font-size:1rem; line-height:1.6;" placeholder="可在這裡輸入考試說明、監考老師或注意事項..."></textarea>
        </div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMfrzpvb3YO_O8DOBiIEghmp27UNC7ZL4",
        authDomain: "examseating-859ae.firebaseapp.com",
        projectId: "examseating-859ae",
        storageBucket: "examseating-859ae.firebasestorage.app",
        messagingSenderId: "547686235744",
        appId: "1:547686235744:web:ba1b0032c43267ce340d05"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, currentRole = null, currentUsername = "", assignedClass = "", mainAdminUID = null, mainAdminName = "";
    let draggedElement = null, isRegisterMode = false;

    const usernameToEmail = (u) => u.trim() ? `${u.trim()}@school.local` : null;
    const showToast = (m) => { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); };

    // 人數即時統計函數
    window.updateStudentCount = () => {
        const count = Array.from(document.querySelectorAll('.student-name')).filter(el => el.innerText.trim() !== "").length;
        const countDisplay = document.getElementById('student-count-display');
        if(countDisplay) countDisplay.innerText = `實排人數：${count} 人`;
    };

    window.toggleAuthMode = () => {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "📝 教師帳號註冊" : "🏫 座位管理系統登入";
        document.getElementById('btn-auth-action').innerText = isRegisterMode ? "✅ 完成註冊" : "🔐 登入系統";
        document.getElementById('auth-switch-text').innerText = isRegisterMode ? "已有帳號？點此登入" : "還沒有帳號？點此註冊";
    };

    window.togglePassword = () => {
        const pwdInput = document.getElementById('auth-password');
        const toggleIcon = document.getElementById('toggle-password');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleIcon.textContent = '🙈';
        } else {
            pwdInput.type = 'password';
            toggleIcon.textContent = '👁️';
        }
    };

    window.handleAuth = async () => {
        const u = document.getElementById('auth-username').value.trim();
        const p = document.getElementById('auth-password').value;
        if(!u || !p) return alert('請完整輸入');
        const e = usernameToEmail(u);
        try {
            if(isRegisterMode) {
                await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, 'usernames', e), { displayName: u });
                showToast('註冊成功！');
            } else { await signInWithEmailAndPassword(auth, e, p); }
        } catch(err) { alert('失敗：帳號或密碼錯誤'); }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-overlay').classList.add('hidden');
            const nameDoc = await getDoc(doc(db, 'usernames', user.email));
            currentUsername = nameDoc.exists() ? nameDoc.data().displayName : user.email.split('@')[0];
            document.getElementById('user-display-name').innerText = currentUsername;

            let rDoc = await getDoc(doc(db, 'roles', user.email));
            if(!rDoc.exists()){
                const all = await getDocs(collection(db, 'roles'));
                if(all.empty) await setDoc(doc(db, 'roles', user.email), { role: 'admin', isMainAdmin: true, uid: user.uid });
                else await setDoc(doc(db, 'roles', user.email), { role: 'teacher', uid: user.uid, class: '' });
                rDoc = await getDoc(doc(db, 'roles', user.email));
            }
            const roleData = rDoc.data();
            currentRole = roleData.role;
            assignedClass = roleData.class || "";
            
            if(roleData.sharedWith) {
                mainAdminUID = roleData.sharedWith;
                const mSnap = await getDocs(query(collection(db, 'roles'), where('uid', '==', mainAdminUID), where('isMainAdmin', '==', true)));
                if(!mSnap.empty){
                    const mnd = await getDoc(doc(db, 'usernames', mSnap.docs[0].id));
                    mainAdminName = mnd.exists() ? mnd.data().displayName : "主管理者";
                }
            } else {
                mainAdminUID = user.uid; mainAdminName = currentUsername;
            }

            applyUI(); refreshClassList(); refreshMemberList(); refreshUserSelect(); initGrid();
        } else { document.getElementById('auth-overlay').classList.remove('hidden'); }
    });

    function applyUI() {
        const isAdmin = currentRole === 'admin';
        document.getElementById('role-badge').innerText = isAdmin ? "🛡️ 管理者" : "👨‍🏫 導師";
        document.getElementById('role-badge').className = "role-badge " + (isAdmin ? "admin" : "teacher");
        document.getElementById('admin-setup-panel').style.display = isAdmin ? 'block' : 'none';
        
        // 確保配置面板對所有人都可見
        document.getElementById('layout-group').style.display = 'block';
        
        // 保護導師不要改錯班級名稱
        const titleInput = document.getElementById('classTitle');
        if (!isAdmin) {
            titleInput.readOnly = true;
            titleInput.title = "導師僅能編輯被指派的班級";
            if (!titleInput.value && assignedClass) {
                titleInput.value = assignedClass;
                syncTitle();
            }
        } else {
            titleInput.readOnly = false;
            titleInput.title = "";
        }
        
        if(isAdmin && mainAdminUID !== currentUser.uid) {
            document.getElementById('main-admin-info').innerText = `🔗 協作模式：編輯 ${mainAdminName} 的班級資料`;
        } else if(isAdmin) {
            document.getElementById('main-admin-info').innerText = `🏠 主管理者：個人資料庫`;
        }
        
        if(!isAdmin) document.getElementById('user-sub-info').innerText = `負責班級：${assignedClass || '未指派'}`;
        else document.getElementById('user-sub-info').innerText = "";
    }

    async function refreshUserSelect() {
        if(currentRole !== 'admin') return;
        const select = document.getElementById('setup-username-select');
        select.innerHTML = '<option value="">-- 選擇註冊成員 --</option>';
        const snap = await getDocs(collection(db, 'usernames'));
        snap.forEach(d => {
            const opt = document.createElement('option'); opt.value = d.data().displayName; opt.innerText = d.data().displayName; select.appendChild(opt);
        });
    }

    async function refreshMemberList() {
        if(currentRole !== 'admin') return;
        const items = document.getElementById('member-items'); items.innerHTML = "載入中...";
        const snap = await getDocs(collection(db, 'roles'));
        items.innerHTML = "";
        snap.forEach(async d => {
            if(d.id === currentUser.email) return;
            const uDoc = await getDoc(doc(db, 'usernames', d.id));
            const name = uDoc.exists() ? uDoc.data().displayName : d.id;
            const data = d.data();
            const div = document.createElement('div'); div.className = 'admin-item';
            div.innerHTML = `<span>${name} (${data.role === 'admin' ? '管理者' : '導師：' + (data.class || '無')})</span>
                <button onclick="removeMember('${d.id}')" style="width:auto; padding:2px 8px; background:#fee2e2; color:red; margin:0;">刪除</button>`;
            items.appendChild(div);
        });
    }

    window.removeMember = async (email) => { if(confirm('確定要移除此成員權限？')) { await deleteDoc(doc(db, 'roles', email)); refreshMemberList(); } }

    window.assignRole = async (roleType) => {
        const n = document.getElementById('setup-username-select').value, c = document.getElementById('setup-class').value;
        if(!n) return alert('請選擇對象');
        const e = usernameToEmail(n);
        await setDoc(doc(db, 'roles', e), { role: roleType, class: roleType === 'teacher' ? c : '', sharedWith: mainAdminUID }, { merge: true });
        showToast(`已指派 ${n} 為 ${roleType === 'admin' ? '管理者' : '導師'}`); refreshMemberList();
    };

    window.syncTitle = () => {
        const titleText = document.getElementById('classTitle').value;
        document.getElementById('class-title-display').innerText = titleText ? `${titleText} 考試座位表` : "請輸入班級名稱";
    }

    window.confirmInit = () => { if(confirm('重新初始化將清空目前佈局，確定嗎？')) initGrid(); };
    window.initGrid = () => {
        const c = parseInt(document.getElementById('cols').value) || 5, r = parseInt(document.getElementById('rows').value) || 5;
        const grid = document.getElementById('grid');
        grid.style.gridTemplateColumns = `repeat(${c}, 100px)`; grid.innerHTML = '';
        for(let i=0; i<c*r; i++) grid.appendChild(createSeat("", false));
        updateStudentCount(); // 更新人數
    };

    function createSeat(name, fixed) {
        const div = document.createElement('div'); div.className = 'seat' + (fixed ? ' is-fixed' : ''); div.draggable = true;
        div.innerHTML = `<span class="student-name">${name}</span>`;
        div.onclick = () => {
            const oldName = div.querySelector('.student-name').innerText;
            const newName = prompt("學生姓名：", oldName);
            if (newName !== null) {
                div.querySelector('.student-name').innerText = newName.trim();
                updateStudentCount(); // 更新人數
            }
        };
        div.oncontextmenu = (e) => { e.preventDefault(); div.classList.toggle('is-fixed'); };
        div.ondragstart = (e) => { draggedElement = div; div.style.opacity = "0.5"; };
        div.ondragend = () => { draggedElement = null; div.style.opacity = "1"; document.querySelectorAll('.seat').forEach(s => s.classList.remove('drag-over')); };
        div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-over'); };
        div.ondragleave = () => div.classList.remove('drag-over');
        div.ondrop = (e) => {
            e.preventDefault();
            if (draggedElement && draggedElement !== div) {
                const tName = div.querySelector('.student-name').innerText, tFixed = div.classList.contains('is-fixed');
                div.querySelector('.student-name').innerText = draggedElement.querySelector('.student-name').innerText;
                if(draggedElement.classList.contains('is-fixed')) div.classList.add('is-fixed'); else div.classList.remove('is-fixed');
                draggedElement.querySelector('.student-name').innerText = tName;
                if(tFixed) draggedElement.classList.add('is-fixed'); else draggedElement.classList.remove('is-fixed');
                updateStudentCount(); // 更新人數
            }
        };
        return div;
    }

    async function refreshClassList() {
        if(!mainAdminUID) return;
        const drop = document.getElementById('classDropdown'), sDrop = document.getElementById('setup-class');
        drop.innerHTML = '<option value="">-- 選擇班級 --</option>'; sDrop.innerHTML = '<option value="">選擇班級</option>';
        const snap = await getDocs(collection(db, 'users', mainAdminUID, 'classes'));
        snap.forEach(d => {
            const opt = document.createElement('option'); opt.value = d.id; opt.innerText = d.id;
            drop.appendChild(opt); sDrop.appendChild(opt.cloneNode(true));
        });
    }

    window.createNewClass = () => {
        // 如果是導師，新建佈局時自動保留他的班級名稱
        document.getElementById('classTitle').value = currentRole === 'teacher' ? assignedClass : "";
        document.getElementById('studentList').value = ""; 
        document.getElementById('class-remarks').value = "";
        syncTitle(); initGrid(); showToast('已清空，可建立新佈局');
    };

    window.saveToCloud = async () => {
        const title = document.getElementById('classTitle').value.trim();
        if(!title) return alert('請輸入班級名稱');
        
        // 核心權限修正：如果是導師才檢查班級限制，管理者可存取任何班級
        if(currentRole === 'teacher' && title !== assignedClass) {
            return alert(`權限限制：導師只能儲存被指派的班級「${assignedClass}」。`);
        }

        const seats = Array.from(document.querySelectorAll('.seat')).map(s => ({
            name: s.querySelector('.student-name').innerText,
            fixed: s.classList.contains('is-fixed')
        }));

        await setDoc(doc(db, 'users', mainAdminUID, 'classes', title), {
            cols: document.getElementById('cols').value, rows: document.getElementById('rows').value,
            remarks: document.getElementById('class-remarks').value, seats, 
            lastEditedBy: currentUsername, lastEditedAt: new Date().toISOString()
        });
        showToast('✅ 雲端同步完成'); refreshClassList();
    };

    window.loadFromDropdown = async () => {
        const s = document.getElementById('classDropdown').value;
        if(!s) return;

        // 核心權限修正：導師才檢查，管理者不限制
        if(currentRole === 'teacher' && s !== assignedClass) {
            return alert(`權限限制：導師只能查看被指派的班級「${assignedClass}」。`);
        }

        const d = await getDoc(doc(db, 'users', mainAdminUID, 'classes', s));
        if(d.exists()){
            const data = d.data();
            document.getElementById('classTitle').value = s;
            document.getElementById('cols').value = data.cols;
            document.getElementById('rows').value = data.rows;
            document.getElementById('class-remarks').value = data.remarks || "";
            syncTitle();
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${data.cols}, 100px)`; grid.innerHTML = '';
            
            // 讀取座位並同時將名字提煉到左側的名單 TextArea 內
            const studentNamesArray = [];
            data.seats.forEach(sd => {
                grid.appendChild(createSeat(sd.name, sd.fixed));
                // 將非空白名字加到陣列
                if (sd.name && sd.name.trim() !== "") {
                    studentNamesArray.push(sd.name.trim());
                }
            });

            // 依據座號(前綴數字)自動排序名單
            studentNamesArray.sort((a, b) => {
                const matchA = a.match(/^\d+/);
                const matchB = b.match(/^\d+/);
                const numA = matchA ? parseInt(matchA[0], 10) : Number.MAX_SAFE_INTEGER;
                const numB = matchB ? parseInt(matchB[0], 10) : Number.MAX_SAFE_INTEGER;
                if (numA !== numB) return numA - numB;
                return a.localeCompare(b, 'zh-Hant');
            });

            document.getElementById('studentList').value = studentNamesArray.join('\n');
            updateStudentCount(); // 載入完畢後更新人數

            showToast(`已載入佈局 (由 ${data.lastEditedBy || '系統'} 編輯於 ${new Date(data.lastEditedAt).toLocaleString()})`);
        }
    };

    window.shuffleNonFixed = () => {
        const students = document.getElementById('studentList').value.split('\n').map(s => s.trim()).filter(s => s);
        if(!students.length) return alert('請在輸入框中填入學生名單');
        const available = Array.from(document.querySelectorAll('.seat')).filter(s => !s.classList.contains('is-fixed'));
        if(students.length > available.length) return alert('位置不足以容納所有學生');
        available.forEach(s => s.querySelector('.student-name').innerText = "");
        [...students].sort(() => Math.random() - 0.5).forEach((name, i) => available[i].querySelector('.student-name').innerText = name);
        
        updateStudentCount(); // 隨機排位後更新人數
        showToast('🎲 隨機排位完成');
    };

    window.downloadImage = () => {
        html2canvas(document.getElementById('capture-area'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `座位表_${document.getElementById('classTitle').value}.png`;
            link.href = canvas.toDataURL('image/png'); link.click();
        });
    };

    window.downloadPDF = () => {
        html2canvas(document.getElementById('capture-area'), { scale: 3 }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgProps = pdf.getImageProperties(imgData);
            const ratio = Math.min(pdfWidth / imgProps.width, pdfHeight / imgProps.height);
            const w = imgProps.width * ratio;
            const h = imgProps.height * ratio;
            pdf.addImage(imgData, 'PNG', (pdfWidth - w) / 2, 0, w, h);
            pdf.save(`座位表_${document.getElementById('classTitle').value}.pdf`);
        });
    };
</script>
</body>
</html>
